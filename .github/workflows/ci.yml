# VeloxFetch tests: format -> lint -> unit + integration tests -> security checks -> dependency audit.
#
# Runs only from the "Run workflow" button (workflow_dispatch): pick the branch to test. Nothing runs
# automatically — no push or pull request triggers it on its own.
#
# Builds are in build.yml (also manual: "Run workflow", pick the branch).
#
# Every third-party action is pinned to a full commit hash (a tag can be moved by whoever owns the
# repository; a hash cannot). The token is read-only unless a job asks for more.

name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: format, lint, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install JavaScript dependencies (exactly what the lockfiles say)
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix apps/browser-extension
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust unit and integration tests
        run: cargo test --workspace --locked
      - name: UI and extension tests
        run: |
          npm test --prefix apps/desktop
          npm test --prefix apps/browser-extension
      - name: Security policy tests
        run: node --test tests/security/policy.test.mjs

  security:
    name: dependency audit, licences, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the audit tools (locked)
        run: cargo install --locked cargo-audit cargo-deny cargo-cyclonedx
      - name: Rust advisories (RUSTSEC)
        run: cargo audit --deny warnings
      - name: Licences, banned crates, sources (deny.toml)
        run: cargo deny check
      - name: npm advisories
        run: |
          npm ci --prefix apps/desktop
          npm audit --prefix apps/desktop --audit-level=low
          npm audit --prefix apps/browser-extension --audit-level=low
      - name: Full security gate
        run: node scripts/security-gate.mjs --ci
      - name: SBOM (CycloneDX)
        run: node scripts/security-gate.mjs --sbom-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: release/sbom/
