# VeloxFetch builds: the installers for Windows, Linux and macOS, with scripts/build-release.sh (the same script as a
# local build). No tests here: run the Tests workflow (ci.yml) for a branch before merging it.
#
# Runs only from the "Run workflow" button (workflow_dispatch): pick the branch (and the systems) and its
# installers are built, to try by hand. Dispatch from a tag `v*` to also publish a private draft GitHub release
# (never published unsigned). Nothing builds automatically — no push or tag triggers a build on its own.
#
# Every third-party action is pinned to a full commit hash. The token is read-only unless a job asks for more.

name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Systems to build
        type: choice
        options: [all, windows, linux, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    name: which systems
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[{"name":"windows-x64","os":"windows-latest"},{"name":"linux-x64","os":"ubuntu-22.04"},{"name":"macos-arm64","os":"macos-latest"},{"name":"macos-x64","os":"macos-15-intel"}]'
          case "$PLATFORMS" in
            all) pick="$all" ;;
            windows) pick="$(jq -c '[.[] | select(.name | startswith("windows"))]' <<<"$all")" ;;
            linux) pick="$(jq -c '[.[] | select(.name | startswith("linux"))]' <<<"$all")" ;;
            macos) pick="$(jq -c '[.[] | select(.name | startswith("macos"))]' <<<"$all")" ;;
            *) echo "unknown choice: $PLATFORMS" >&2; exit 1 ;;
          esac
          echo "matrix={\"include\":$pick}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: [plan]
    runs-on: ${{ matrix.os }}
    # Tags build in the protected "release" environment (its reviewers approve, and only it holds the signing
    # secrets); everything else in "build" (no secrets unless the owner adds test certificates there).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'build' }}
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    strategy:
      fail-fast: false
      # Linux is built on the oldest supported Ubuntu: the packages then also run on older distributions.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The same script as a local build: it installs what is missing (Linux libraries with apt), builds the
      # extension, the helper, the app and its installers, and collects them with SHA256SUMS.txt in release/.
      # The security gate runs with the tests, on every commit of the branch (ci.yml).
      # Signing certificates, only when the secrets exist (otherwise the build is unsigned). They live in the
      # "release" environment for tags (required reviewers), else in the "build" environment.
      - name: Import the Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Import the Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Build the release
        shell: bash
        env:
          # macOS notarization (used only when set; see scripts/build-release.sh).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-release.sh --skip-gate
      - name: Artifact name (a branch like feature/x cannot have "/" in it)
        id: ref
        shell: bash
        run: echo "name=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The branch is in the name: builds of several branches can be told apart.
          name: VeloxFetch-${{ matrix.name }}-${{ steps.ref.outputs.name }}
          path: |
            release/*
            !release/sbom
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    # Protected environment: required reviewers, and the only place the signing secrets exist.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Collect the files and hash them
        run: |
          mkdir -p out
          # Every system builds the same extension zips: keep one copy of each name.
          for f in artifacts/*/*; do
            name="$(basename "$f")"
            case "$name" in SHA256SUMS.txt|MANUAL-TEST.md|security-gate-report.json) continue ;; esac
            [ -e "out/$name" ] || cp "$f" "out/$name"
          done
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish as a private draft (checked by hand before it is made public)
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$WINDOWS_CERT_PFX_BASE64" ] || [ -z "$APPLE_CERTIFICATE" ]; then
            echo "some installers are unsigned (no certificate in the release environment)" >&2
          fi
          if [ -n "$RELEASE_GPG_KEY" ]; then
            # A detached signature over the checksums: whoever has the public key can check every file.
            echo "$RELEASE_GPG_KEY" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign --output out/SHA256SUMS.txt.asc out/SHA256SUMS.txt
          fi
          # Never published directly: the release stays a draft only the owners see, to be
          # checked (docs/manual-test.md) before it is made public by hand.
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --title "VeloxFetch $TAG" \
            --notes "Built by CI from $GITHUB_SHA. Check it (docs/manual-test.md) before publishing. SHA-256 sums in SHA256SUMS.txt (signed in SHA256SUMS.txt.asc when the release key is set)."
