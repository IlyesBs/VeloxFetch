[package]
name = "download-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
downloader-core = { path = "../downloader-core" }
http-client = { path = "../http-client" }
path-safety = { path = "../path-safety" }
secrets = { path = "../secrets" }
media-engine = { path = "../media-engine" }
tokio-util.workspace = true
persistence = { path = "../persistence" }
scheduler = { path = "../scheduler" }
system-integration = { path = "../system-integration" }
tokio.workspace = true
serde.workspace = true
url.workspace = true
# The publisher's checksum (manager/publisher.rs): file names in links (already in the tree through `url`).
percent-encoding = "2.3"
thiserror.workspace = true
tracing.workspace = true
fs4 = "1.1.0"
failpoint = { path = "../failpoint" }
diagnostics = { path = "../diagnostics" }
# Updates of VeloxFetch itself (manager/update.rs): the signed manifest and the package checks.
update-verify = { path = "../update-verify" }
bytes.workspace = true
serde_json = "1"
# Video tools fetched on first use (manager/tools.rs): checksum, and one entry out of a ZIP.
sha2 = "0.10"
flate2 = "1"
# The installer's own compressed copies of the video tools (xz with the x86 / ARM64 filters): unpacked offline.
# Pure, safe Rust (no `optimization`: no unsafe code), decoder only (no C library to build on any system).
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
futures-util.workspace = true
# The dashboard's live network (whole computer) and disk (download folder's drive) activity: counters only.
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network"] }


[dev-dependencies]
# Tests pack their own stand-in programs (the shipped program only ever unpacks).
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "encoder"] }
