[package]
name = "system-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# Clipboard text, on Windows (Win32), macOS (NSPasteboard) and Linux (X11 and, where the compositor
# allows it, Wayland data-control). No image support: only text is ever read.
[dependencies.arboard]
version = "3"
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.arboard]
version = "3"
default-features = false
features = ["wayland-data-control"]
