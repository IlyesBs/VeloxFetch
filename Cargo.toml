[workspace]
resolver = "2"
members = ["crates/http-client", "crates/downloader-core", "crates/persistence", "crates/download-manager", "crates/scheduler", "crates/system-integration", "crates/browser-bridge", "crates/media-engine", "crates/path-safety", "crates/secrets", "crates/failpoint", "crates/diagnostics", "crates/update-verify", "apps/cli", "apps/native-host", "apps/desktop/src-tauri", "tests/integration", "tests/bench"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "http2", "socks"] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
url = "2"
tracing = "0.1"

# The xz decoder is slow unoptimized: development builds and tests unpack the video tools at a usable speed.
[profile.dev.package.lzma-rust2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Drop debug symbols and the symbol table from every release binary (the CLI and the native host too,
# not only the app the bundler already strips): smaller binaries, no debug metadata shipped to users.
strip = "symbols"
