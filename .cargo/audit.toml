# cargo-audit policy. The same reviewed exceptions as deny.toml (each one is explained there).
[advisories]
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error: build-time macro of the GTK3 bindings (Linux)
    "RUSTSEC-2024-0429", # glib 0.18 VariantStrIter: Tauri's GTK3 layer on Linux, not used by us
    "RUSTSEC-2025-0075", # unic-* unmaintained: build-time dependency of tauri-utils
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0370", # zvariant unmaintained: zbus 5 (keyring's Secret Service, portal call); see deny.toml
    "RUSTSEC-2026-0371", # zbus_names unmaintained: same
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained: same
]
